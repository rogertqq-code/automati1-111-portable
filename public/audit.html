<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Fingerprint Audit</title>
    <!-- FingerprintJS open-source -->
    <script src="/fp.js"></script>
    <!-- ThumbmarkJS -->
    <script src="/thumbmark.js"></script>
</head>
<body>
    <h1>Fingerprint Audit Runner</h1>
    <p>Generating fingerprints and posting to server...</p>
    <pre id="log"></pre>

    <script>
        function logMsg(msg) {
            console.log(msg);
            document.getElementById('log').innerText += msg + "\n";
        }

        async function generateFingerprints() {
            try {
                const startTime = Date.now();
                
                // 1. ThumbmarkJS
                logMsg("Generating ThumbmarkJS...");
                const tm = window.ThumbmarkJS || window.thumbmark;
                const thumbmarkData = await tm.getFingerprintData();
                const thumbmarkHash = await tm.getFingerprint();
                logMsg("ThumbmarkJS generated.");

                // 2. FingerprintJS
                logMsg("Generating FingerprintJS...");
                const fpjs = await FingerprintJS.load();
                const fpjsResult = await fpjs.get();
                logMsg("FingerprintJS generated.");

                // Gather some basic environment info
                const env = {
                    userAgent: navigator.userAgent,
                    screenWidth: screen.width,
                    screenHeight: screen.height,
                    devicePixelRatio: window.devicePixelRatio
                };

                const payload = {
                    seed: new URLSearchParams(window.location.search).get('seed') || 'unknown',
                    timestamp: new Date().toISOString(),
                    elapsedMs: Date.now() - startTime,
                    thumbmark: {
                        hash: thumbmarkHash,
                        data: thumbmarkData
                    },
                    fingerprintjs: {
                        hash: fpjsResult.visitorId,
                        components: fpjsResult.components
                    },
                    environment: env
                };

                logMsg("Posting results to server...");
                const res = await fetch('/api/audit/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    logMsg("SUCCESS: Fingerprint data submitted.");
                    // Add a special element so playwright knows we are done
                    const doneEl = document.createElement('div');
                    doneEl.id = 'audit-complete';
                    doneEl.innerText = 'OK';
                    document.body.appendChild(doneEl);
                } else {
                    logMsg("ERROR: Failed to submit to server.");
                }

            } catch (err) {
                logMsg("FATAL ERROR: " + err.message);
            }
        }

        // Run automatically
        generateFingerprints();
    </script>
</body>
</html>
