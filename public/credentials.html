<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credentials Database</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Shared Theme */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #08090d; --surface: #0f1117; --card: #161822; --border: rgba(255,255,255,.06);
      --text: #e2e8f0; --text2: #8892a8; --accent: #00d4ff; --green: #10b981; --red: #ef4444; --amber: #f59e0b;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .header { padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: var(--surface); }
    .nav-links a { color: var(--text2); text-decoration: none; font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 6px; }
    .nav-links a.active { background: rgba(255,255,255,0.05); color: var(--text); }
    .nav-links a:hover { color: var(--text); }
    .command-centre { display: flex; flex-direction: column; gap: 24px; width: 100%; height: calc(100vh - 80px); padding: 0 32px 32px 32px; box-sizing: border-box; }
    .command-console { flex: 0 0 200px; background: rgba(10,15,25,0.85); border: 1px solid rgba(56,189,248,0.4); border-radius: 12px; overflow: hidden; box-shadow: 0 0 30px rgba(56,189,248,0.15), inset 0 0 20px rgba(0,0,0,0.8); backdrop-filter: blur(20px); }
    .console-header { background: rgba(56,189,248,0.1); padding: 8px 16px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #38bdf8; border-bottom: 1px solid rgba(56,189,248,0.2); letter-spacing: 2px; text-transform: uppercase; display: flex; justify-content: space-between; }
    .console-header::before { content: "SYS.OP // TERMINAL_UPLINK_ESTABLISHED"; }
    .log-body { flex: 1; padding: 16px; overflow-y: auto; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #34d399; text-shadow: 0 0 5px rgba(52,211,153,0.4); display: flex; flex-direction: column; gap: 4px; }
    .main { flex: 1; overflow-y: auto; }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #08090d; --surface: #0f1117; --card: #161822; --border: rgba(255, 255, 255, .06);
      --text: #e2e8f0; --text2: #8892a8; --accent: #00d4ff; --green: #10b981; --red: #ef4444; --amber: #f59e0b;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 50px; }
    .header { padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: var(--surface); }
    .header h1 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .nav-links { display: flex; gap: 20px; }
    .nav-links a { color: var(--text2); text-decoration: none; font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 6px; }
    .nav-links a.active { background: rgba(255,255,255,0.05); color: var(--text); }
    .nav-links a:hover { color: var(--text); }
    .main { padding: 24px 32px; max-width: 1400px; margin: 0 auto; }
    .section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 30px; }
    .section-title { padding: 16px 20px; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 600; }
    .section-title.success { color: var(--green); }
    .section-title.temp { color: var(--amber); }
    .section-title.perm { color: var(--red); }
    table { width: 100%; border-collapse: collapse; }
    th { padding: 10px 16px; text-align: left; font-size: 11px; color: var(--text2); text-transform: uppercase; border-bottom: 1px solid var(--border); background: rgba(255, 255, 255, .02); }
    td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid var(--border); }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .badge-success { background: rgba(16, 185, 129, .15); color: var(--green); }
    .badge-error { background: rgba(239, 68, 68, .15); color: var(--red); }
    .badge-warn { background: rgba(245, 158, 11, .15); color: var(--amber); }
  </style>
</head>
<body>
  <div class="command-centre">
    <div class="command-console">
      <div class="console-header"><span></span><span id="logCount">0</span> LOGS</div>
      <div id="logBody" class="log-body"></div>
    </div>
<div class="banner">
  <img src="/command_centre_concept_1780066802195.png" alt="Command Centre Banner" style="width:100%; height:auto; max-height:200px; object-fit:cover;">
</div>
  </div>
  <div class="main">
    <div class="section">
      <div class="section-title success">✅ Successful Logins</div>
      <table>
        <thead><tr><th>Email</th><th>Target</th><th>Outcome</th><th>Session ID</th></tr></thead>
        <tbody id="successBody"></tbody>
      </table>
    </div>

    <div class="section">
      <div class="section-title temp">⚠️ Temp Disabled</div>
      <table>
        <thead><tr><th>Email</th><th>Target</th><th>Error / Details</th><th>Session ID</th></tr></thead>
        <tbody id="tempBody"></tbody>
      </table>
    </div>

    <div class="section">
      <div class="section-title perm">❌ Perm Disabled</div>
      <table>
        <thead><tr><th>Email</th><th>Target</th><th>Error / Details</th><th>Session ID</th></tr></thead>
        <tbody id="permBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadHistory() {
      try {
        const res = await fetch('/api/credentials/history');
        const data = await res.json();
        const history = data.history || [];

        const successBody = document.getElementById('successBody');
        const tempBody = document.getElementById('tempBody');
        const permBody = document.getElementById('permBody');

        const badgeClass = (outcome) => {
          if (outcome === 'success') return 'badge-success';
          if (outcome === 'permdisabled') return 'badge-error';
          if (outcome === 'tempdisabled') return 'badge-warn';
          return '';
        };

        history.forEach(run => {
          const tr = document.createElement('tr');
          
          if (run.outcome === 'success') {
            tr.innerHTML = `
              <td>${run.email}</td>
              <td>${run.target_site}</td>
              <td><span class="badge ${badgeClass(run.outcome)}">${run.outcome}</span></td>
              <td>${run.session_id || '—'}</td>
            `;
            successBody.appendChild(tr);
          } else if (run.outcome === 'tempdisabled') {
            tr.innerHTML = `
              <td>${run.email}</td>
              <td>${run.target_site}</td>
              <td style="color:var(--text2)">${run.error || '—'}</td>
              <td>${run.session_id || '—'}</td>
            `;
            tempBody.appendChild(tr);
          } else if (run.outcome === 'permdisabled') {
            tr.innerHTML = `
              <td>${run.email}</td>
              <td>${run.target_site}</td>
              <td style="color:var(--text2)">${run.error || '—'}</td>
              <td>${run.session_id || '—'}</td>
            `;
            permBody.appendChild(tr);
          }
        });
      } catch (e) {
        console.error('Failed to load history', e);
      }
    }
    loadHistory();
  </script>
</body>
</html>
