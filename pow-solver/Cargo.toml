[package]
name = "pow-solver"
version = "0.1.0"
edition = "2021"
description = "Wicketkeeper.io Proof-of-Work solver — brute-force SHA-256 nonce finder"
license = "MIT"

[dependencies]
sha2 = "0.10"
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
