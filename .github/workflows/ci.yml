name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel in-progress runs of the same workflow on the same ref. Saves CI minutes
# when a developer force-pushes several times in quick succession.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: "Gitleaks Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2.3.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typecheck-and-test:
    name: typecheck + vitest + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v6 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage
        env:
          SPIDER_API_KEY: ${{ secrets.SPIDER_API_KEY }}
          SPIDER_LOCAL_API_KEY: ${{ secrets.SPIDER_LOCAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GCS_ACCESS_KEY: ${{ secrets.GCS_ACCESS_KEY }}
          GCS_SECRET_KEY: ${{ secrets.GCS_SECRET_KEY }}
          GCS_PROJECT_ID: ${{ secrets.GCS_PROJECT_ID }}
          GCS_PATH_PREFIX: ${{ secrets.GCS_PATH_PREFIX }}
          GCS_ENABLED: ${{ secrets.GCS_ENABLED }}
          PRIMARY_PROXY_URL: ${{ secrets.PRIMARY_PROXY_URL }}
          EXTERNAL_PROXY_POOL: ${{ secrets.EXTERNAL_PROXY_POOL }}
          PROXY_ROTATE_URL_TEMPLATE: ${{ secrets.PROXY_ROTATE_URL_TEMPLATE }}
          REDIS_URL: ${{ secrets.REDIS_URL }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4 # v4.6.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Flaky test detection (3 passes, shuffled)
        run: |
          for i in 1 2 3; do
            echo "=== Flaky detection pass $i/3 ==="
            npx vitest run --config vitest.flaky.config.ts
          done

  playwright:
    name: playwright smoke specs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v6 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Playwright tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm run test:e2e
        env:
          SPIDER_API_KEY: ${{ secrets.SPIDER_API_KEY }}
          SPIDER_LOCAL_API_KEY: ${{ secrets.SPIDER_LOCAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PRIMARY_PROXY_URL: ${{ secrets.PRIMARY_PROXY_URL }}
          EXTERNAL_PROXY_POOL: ${{ secrets.EXTERNAL_PROXY_POOL }}
          PROXY_ROTATE_URL_TEMPLATE: ${{ secrets.PROXY_ROTATE_URL_TEMPLATE }}

      - name: Upload to TestDino
        if: always()
        run: npx tdpw upload ./playwright-report --token="${{ secrets.TESTDINO_TOKEN }}" --upload-html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
