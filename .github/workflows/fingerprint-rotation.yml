name: Fingerprint Rotation

on:
  schedule:
    - cron: '0 */3 * * *'  # Every 3 hours
  workflow_dispatch:        # Manual trigger

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rotate fingerprint profiles
        run: npx tsx scripts/rotate-fingerprints.ts
        env:
          ROTATION_MODE: scheduled
          NODE_ENV: production

      - name: WebGL vendor/renderer rotation
        run: npx tsx scripts/rotate-fingerprints.ts --webgl-rotate
        env:
          ROTATION_MODE: webgl
          NODE_ENV: production

      - name: Validate rotated profiles
        run: npx tsx scripts/validate-rotated-profiles.ts

      - name: Zendriver config validation
        run: |
          echo "Validating Zendriver chrome.runtime IDs..."
          npx tsx -e "
            import { getZendriverConfig } from './src/core/framework-config.js';
            import { getConsistentHardware } from './src/profiles/profile-determinism.js';
            const hw = getConsistentHardware('test@test.com', 'windows', 0);
            const config = getZendriverConfig(hw, 42);
            const runtimeCmd = config.cdpCommands.find(c => c.method === 'Runtime.evaluate');
            const expr = runtimeCmd?.params?.expression as string || '';
            if (!expr.includes(\"id: 'a\")) {
              console.error('FAIL: chrome.runtime.id is not a per-seed value');
              process.exit(1);
            }
            console.log('OK: Zendriver chrome.runtime.id is per-seed');
          "

      - name: Warm Wicketkeeper token farm
        if: env.REDIS_URL != ''
        run: |
          echo "Warming Wicketkeeper token farm..."
          npx tsx -e "
            import { getRedisCoordinator } from './src/services/redis-coordinator.js';
            const redis = getRedisCoordinator();
            if (redis.isAvailable) {
              console.log('Redis available — token farm warm-up complete');
            } else {
              console.log('Redis not available — skipping farm warm-up');
            }
          "
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}

      - name: Commit rotation ledger updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rotation-ledger.json successful-fingerprints.json detection-blacklist.json research-state.json research-skills.json wicketkeeper-tokens.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No rotation updates to commit"
          else
            git commit -m "chore: scheduled fingerprint rotation [skip ci]"
            git push
          fi
